<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">User histories, sub-token fibres, member closure, and global return</title><desc id="desc">Three participant histories fold into sub-token fibres, which enter a member token and extend to an independent global network return.</desc><rect width="1200" height="680" fill="#fbfaf6"/><style>text{font-family:Arial,sans-serif;fill:#17202b}.h{font-size:30px;font-weight:700}.t{font-size:20px}.s{font-size:16px;fill:#65707a}.box{fill:#f4efe5;stroke:#17202b;stroke-width:2}.gold{stroke:#ad7b18}.purple{stroke:#67517f}.blue{stroke:#17375f}.green{stroke:#2f725d}.arrow{fill:none;stroke-width:4;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><text x="50" y="60" class="h">User histories, sub-token fibres, and global return</text><g><rect x="60" y="130" width="130" height="60" rx="8" class="box"/><text x="125" y="168" text-anchor="middle" class="t">Alice</text><rect x="250" y="130" width="90" height="60" rx="8" class="box gold"/><text x="295" y="168" text-anchor="middle" class="t">μ1</text><rect x="390" y="130" width="90" height="60" rx="8" class="box gold"/><text x="435" y="168" text-anchor="middle" class="t">μ2</text><rect x="530" y="130" width="160" height="60" rx="8" class="box purple"/><text x="610" y="158" text-anchor="middle" class="t">sub-token</text><text x="610" y="181" text-anchor="middle" class="s">fibre</text><path d="M190 160H250M340 160H390M480 160H530" class="arrow gold"/></g><g><rect x="60" y="250" width="130" height="60" rx="8" class="box"/><text x="125" y="288" text-anchor="middle" class="t">Bob</text><rect x="250" y="250" width="90" height="60" rx="8" class="box gold"/><text x="295" y="288" text-anchor="middle" class="t">μ1</text><rect x="390" y="250" width="90" height="60" rx="8" class="box gold"/><text x="435" y="288" text-anchor="middle" class="t">μ2</text><rect x="530" y="250" width="160" height="60" rx="8" class="box purple"/><text x="610" y="278" text-anchor="middle" class="t">sub-token</text><text x="610" y="301" text-anchor="middle" class="s">fibre</text><path d="M190 280H250M340 280H390M480 280H530" class="arrow gold"/></g><g><rect x="60" y="370" width="130" height="60" rx="8" class="box"/><text x="125" y="408" text-anchor="middle" class="t">Carol</text><rect x="250" y="370" width="90" height="60" rx="8" class="box gold"/><text x="295" y="408" text-anchor="middle" class="t">μ1</text><rect x="390" y="370" width="90" height="60" rx="8" class="box gold"/><text x="435" y="408" text-anchor="middle" class="t">μ2</text><rect x="530" y="370" width="160" height="60" rx="8" class="box purple"/><text x="610" y="398" text-anchor="middle" class="t">sub-token</text><text x="610" y="421" text-anchor="middle" class="s">fibre</text><path d="M190 400H250M340 400H390M480 400H530" class="arrow gold"/></g><rect x="790" y="205" width="250" height="150" rx="12" class="box purple"/><text x="915" y="255" text-anchor="middle" class="t">MEMBER TOKEN</text><text x="915" y="288" text-anchor="middle" class="s">higher closure with</text><text x="915" y="312" text-anchor="middle" class="s">ordered child support</text><path d="M690 160L790 245M690 280H790M690 400L790 315" class="arrow purple"/><rect x="790" y="455" width="250" height="105" rx="12" class="box blue"/><text x="915" y="495" text-anchor="middle" class="t">GLOBAL NETWORK</text><text x="915" y="525" text-anchor="middle" class="s">independent return</text><path d="M875 355V455" class="arrow blue"/><path d="M955 455V355" class="arrow green"/><text x="600" y="630" text-anchor="middle" class="s">Finite repetition inside one controlled component is archived but does not create a new closure rank.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Closure-causal ball-hair cycle</title><desc id="desc">Originless opening generates a local ball and global hair around an open Potential Gate; independent return resolves to closed topology, closed-to-opening, or open/collapse.</desc><rect width="1200" height="680" fill="#fbfaf6"/><style>text{font-family:Arial,sans-serif;fill:#17202b}.h{font-weight:700;font-size:30px}.t{font-size:22px}.s{font-size:16px;fill:#65707a}.box{fill:#f4efe5;stroke:#17202b;stroke-width:2}.gold{stroke:#ad7b18}.blue{stroke:#17375f}.purple{stroke:#67517f}.green{stroke:#2f725d}.red{stroke:#884b43}.arrow{fill:none;stroke-width:4;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><text x="50" y="60" class="h">Closure-causal ball-hair cycle</text><rect x="445" y="85" width="310" height="90" rx="12" class="box gold"/><text x="600" y="125" text-anchor="middle" class="t">ORIGINLESS OPENING</text><text x="600" y="150" text-anchor="middle" class="s">closure prior to selected topology</text><rect x="75" y="265" width="300" height="130" rx="12" class="box gold"/><text x="225" y="315" text-anchor="middle" class="t">LOCAL BALL</text><text x="225" y="345" text-anchor="middle" class="s">human / agent pointing</text><text x="225" y="370" text-anchor="middle" class="s">authored semantic partition</text><rect x="825" y="265" width="300" height="130" rx="12" class="box blue"/><text x="975" y="315" text-anchor="middle" class="t">GLOBAL HAIR</text><text x="975" y="345" text-anchor="middle" class="s">world / network continuation</text><text x="975" y="370" text-anchor="middle" class="s">transformed independent return</text><rect x="450" y="245" width="300" height="170" rx="14" class="box purple"/><text x="600" y="300" text-anchor="middle" class="t">POTENTIAL GATE</text><text x="600" y="335" text-anchor="middle" class="s">OPEN while topology, meaning,</text><text x="600" y="360" text-anchor="middle" class="s">and recovery remain unresolved</text><path d="M500 175L305 265" class="arrow gold"/><path d="M700 175L895 265" class="arrow blue"/><path d="M375 330L450 330" class="arrow gold"/><path d="M825 330L750 330" class="arrow blue"/><rect x="95" y="505" width="300" height="95" rx="12" class="box green"/><text x="245" y="545" text-anchor="middle" class="t">CLOSED</text><text x="245" y="575" text-anchor="middle" class="s">receipt + next basis</text><rect x="450" y="505" width="300" height="95" rx="12" class="box blue"/><text x="600" y="545" text-anchor="middle" class="t">CLOSED → OPENING</text><text x="600" y="575" text-anchor="middle" class="s">parent receipt + child gate</text><rect x="805" y="505" width="300" height="95" rx="12" class="box red"/><text x="955" y="545" text-anchor="middle" class="t">OPEN / COLLAPSE</text><text x="955" y="575" text-anchor="middle" class="s">retain evidence; no token</text><path d="M530 415L310 505" class="arrow green"/><path d="M600 415L600 505" class="arrow blue"/><path d="M670 415L890 505" class="arrow red"/><text x="600" y="650" text-anchor="middle" class="s">Hashes, prices, ledgers, and model outputs are projections of the returned relation—not its origin.</text></svg>
